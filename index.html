<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPULSA 4.0 - Panel de Control</title>
    <style>
        /* Estilos Base */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* --- Layout Superior (Header) --- */
        .header {
            background-color: #232C54; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 85px;
            border-bottom: 2px solid #19203e;
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 0 25px;
        }

        .header-left {
            display: flex;
            align-items: center;
            z-index: 102;
        }

        /* Botón de Menú Hamburguesa (Tres Barras) */
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 24px;
            width: 32px;
        }

        .menu-btn span {
            width: 100%;
            height: 3px;
            background-color: #E6E6E6; 
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Contenedor del Banner Centralizado */
        .banner-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 40%;
            pointer-events: none;
        }

        .project-banner {
            max-height: 55px;
            width: auto;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Contenedor de la Derecha (Patrocinadores + Link Web) */
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px; /* Separación elegante entre patrocinadores y enlace web */
            z-index: 102;
        }

        /* Imagen de Patrocinadores en Alta Calidad */
        .sponsors-banner {
            max-height: 45px; /* Tamaño optimizado para agrupar píxeles y ganar nitidez */
            width: auto;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Enlace Externo Vertical (Ícono + Texto "Web") */
        .external-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #E6E6E6; 
            transition: transform 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .external-link-btn:hover {
            transform: scale(1.08);
            color: #ffffff;
        }

        .link-icon {
            font-size: 1.4rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .link-text {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Menú Lateral (Sidebar) --- */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            height: 100%;
            width: 280px;
            background-color: #232C54; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 90;
            padding-top: 105px;
            box-sizing: border-box;
            border-right: 1px solid #19203e;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-item {
            padding: 16px 25px;
            font-size: 1rem;
            color: #E6E6E6; 
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.2s;
            font-weight: 500;
        }

        .sidebar-item:hover {
            background-color: #2c3766;
            color: #ffffff;
            border-left: 4px solid #ffffff;
        }

        .sidebar-item.active {
            background-color: #19203e;
            color: #ffffff;
            border-left: 4px solid #ffffff;
            font-weight: 600;
        }

        /* Capa oscura de fondo al abrir menú */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 80;
        }

        .overlay.active {
            display: block;
        }

        /* --- Contenedor de Pantallas --- */
        .main-content {
            flex: 1;
            width: 100%;
            display: flex;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        iframe.active {
            display: block;
        }

        /* Estilo para los módulos Beta en desarrollo */
        .placeholder-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #6c757d;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .placeholder-content.active {
            display: flex;
        }

        .placeholder-content h2 {
            color: #232C54;
            margin-bottom: 10px;
        }

        /* Ajustes de pantalla responsiva */
        @media (max-width: 992px) {
            .sponsors-banner { max-height: 35px; }
            .banner-container { width: 30%; }
        }

        @media (max-width: 768px) {
            .banner-container { display: none; } /* Oculta banner central en pantallas muy chicas para evitar colisiones */
            .sponsors-banner { max-height: 30px; }
            .header-right { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="banner-container">
            <img src="Banner_Impulsa4.0_1.png" alt="Banner IMPULSA 4.0" class="project-banner">
        </div>

        <div class="header-right">
            <img src="Patrocinadores_Impulsa4.0.png" alt="Patrocinadores IMPULSA 4.0" class="sponsors-banner">
            
            <a href="https://ccm-eleva.cl/mejoramiento-de-la-educacion/impulsa/" target="_blank" class="external-link-btn">
                <span class="link-icon">🔗</span>
                <span class="link-text">web</span>
            </a>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-item active" onclick="switchPanel('dashboard-general', this)">
            📊 Dashboard General
        </div>
        <div class="sidebar-item" onclick="switchPanel('panel-actividades', this)">
            📅 Actividades
        </div>
        <div class="sidebar-item" onclick="switchPanel('panel-registros', this)">
            📁 Registros IMPULSA 4.0
        </div>
    </nav>

    <main class="main-content">
        <iframe id="dashboard-general" class="active" src="https://app.powerbi.com/view?r=eyJrIjoiNTg3YzQzNDQtOGZiMS00MWNiLWFkZDItYjVmOWNjOTJhYmQzIiwidCI6IjE2NWZlNzc0LTQwZjgtNDJjZS04ZDMzLThmZTI1Y2Q0MzY2MiJ9" allowFullScreen="true"></iframe>

        <iframe id="panel-actividades" src="https://app.powerbi.com/view?r=eyJrIjoiZWRiMDVmMjYtZWJkZi00MGE2LWEzOWYtYzI0YzljMzUyM2FjIiwidCI6IjE2NWZlNzc0LTQwZjgtNDJjZS04ZDMzLThmZTI1Y2Q0MzY2MiJ9" allowFullScreen="true" title="IMPULSA4.0_Planificación"></iframe>

        <div id="panel-registros" class="placeholder-content">
            <h2>📁 Banco de Registros</h2>
            <p>Módulo multimedia en desarrollo. Destinado al almacenamiento ordenado de registros fotográficos, videos y reportes finales.</p>
        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function switchPanel(id, element) {
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.placeholder-content').forEach(d => d.classList.remove('active'));

            document.getElementById(id).classList.add('active');

            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');

            toggleMenu();
        }
    </script>
</body>
</html>
